name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check documentation references
        run: npm run docs:check

      - name: Test contributor wall
        run: npm run contributors:test

      - name: Build docs
        run: npm run docs:build

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r code/requirements-test.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run Python tests
        run: python code/run_tests.py

      - name: Compile Python examples
        run: python -m compileall -q code
